name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-readme-stats
  cancel-in-progress: true  

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Kalyan-Deva&custom_title=GitHub%20Overview&show_icons=true&include_all_commits=true&hide=issues&hide_rank=true&disable_animations=true&bg_color=0D1117&title_color=D4AF7A&text_color=C9D1D9&icon_color=D4AF7A&border_color=30363D&border_radius=8
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kalyan-Deva&custom_title=Language%20Distribution&layout=compact&langs_count=8&hide=html,css,scss,jupyter%20notebook&size_weight=0.5&count_weight=0.5&disable_animations=true&bg_color=0D1117&title_color=D4AF7A&text_color=C9D1D9&border_color=30363D&border_radius=8
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated cards
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-languages.svg

          if git diff --cached --quiet; then
            echo "No card changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub statistics"

          # Incorporate commits added after this workflow started.
          git pull --rebase origin main

          # Retry in case another commit lands during the first push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Statistics successfully pushed."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing and retrying..."
            git pull --rebase origin main
            sleep 5
          done

          echo "Unable to push after three attempts."
          exit 1
